services:
  whisper-transcribe-worker-1:
    image: whisper-transcribe-worker:0.1
    hostname: whisper-transcribe-worker-1
    container_name: whisper-transcribe-worker-1
    restart: unless-stopped
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 192.168.3.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - AIGC_UID=${AIGC_UID:-1001}
      - AIGC_GID=${AIGC_GID:-1001}
      - CELERY_CONCURRENCY=1
      - FILE_SYNC_TRANSPORT=quic
      - WHISPER_MODEL_PATH=/app/models/whisper-model
      - WHISPER_MODEL_NAME=large-v3-turbo
      - TZ=Asia/Shanghai
    env_file:
      - /home/aigc/data/env/.env_mqdb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/aigc/work/models/aivoice_models/transcribe_models/faster-whisper-large-v3-turbo-ct2:/app/models/whisper-model
      - /home/aigc/data/userupload/aivoicelab:/app/data/uploads
      - /home/aigc/data/aioutput/transcribe:/app/data/transcribe
      - /home/aigc/data/video/tts:/app/data/tts
      - /home/aigc/data/aioutput/worker-logs/whisper-transcribe-worker1-logs:/app/log
      - /home/aigc/data/rsync/local_rsync_proxies:/app/data/local_rsync_proxies
      - /home/aigc/data/rsync/socat_rsync_proxies:/app/data/socat_rsync_proxies
      - /home/aigc/data/ssh_control/whisper-transcribe-worker-1:/app/data/ssh_control
      - /home/aigc/.ssh:/mnt/ssh-keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
