services:
  htmlvideo-worker:
    image: htmlvideo-worker-image:0.1
    hostname: htmlvideo-worker
    container_name: htmlvideo-worker
    network_mode: host
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 192.168.3.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    environment:
      - AIGC_UID=${AIGC_UID:-1001}
      - AIGC_GID=${AIGC_GID:-1001}
      - TZ=Asia/Shanghai
      - FILE_SYNC_TRANSPORT=quic
    env_file:
      - /home/aigc/data/env/.env_htmlvideo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/aigc/data/aioutput/worker-logs/htmlvideo-worker-logs:/app/log
      - /home/aigc/data/aioutput/htmlvideos:/app/videos
    extra_hosts:
      - "host.docker.internal:host-gateway"
