services:
  htmlvideo-worker:
    image: htmlvideo-worker-image:0.1
    hostname: htmlvideo-worker
    container_name: htmlvideo-worker
    network_mode: host
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 192.168.3.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    environment:
      - AIGC_UID=${AIGC_UID:-1001}
      - AIGC_GID=${AIGC_GID:-1001}
      - TZ=Asia/Shanghai
      - FILE_SYNC_TRANSPORT=quic
      - INTENT_MOCK=true
    env_file:
      - /home/aigc/data/env/.env_usmqdb
      - /home/aigc/data/env/.env_htmlvideo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/aigc/data/aioutput/worker-logs/htmlvideo-worker-logs:/app/log
      - /home/aigc/data/aioutput/htmlvideos:/app/videos
      - /home/aigc/work/models/translate_models/fasttext_models:/app/models/fasttext_models
      - /home/aigc/data/ssh_control/htmlvideo-worker:/app/data/ssh_control
      - /home/aigc/data/rsync/socat_rsync_proxies:/app/data/socat_rsync_proxies
      - /home/aigc/.ssh:/mnt/ssh-keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
