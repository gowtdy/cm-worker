services:
  indextts-worker-preview:
    image: indextts-worker:1.3
    hostname: indextts-worker-preview
    container_name: indextts-worker-preview
    restart: unless-stopped
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 192.168.3.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - AIGC_UID=${AIGC_UID:-1001}
      - AIGC_GID=${AIGC_GID:-1001}
      - GPU_INDEX=0
      - CELERY_CONCURRENCY=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TZ=Asia/Shanghai
      # Cross-chunk GPT || s2mel overlap (1=on, 0=off)
      - INDEXTTS_PIPELINE_OVERLAP=1
      # quic or rsync, default is quic
      - FILE_SYNC_TRANSPORT=quic
    env_file:
      - /home/aigc/data/env/.env_usmqdb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/aigc/work/models/aivoice_models/indextts_models/IndexTTS-2.5:/app/models/indextts-model
      - /home/aigc/work/models/aivoice_models/indextts_models/w2v-bert-2.0:/app/models/indextts-model/hf_cache/w2v-bert-2.0
      - /home/aigc/work/models/aivoice_models/indextts_models/campplus/campplus_cn_common.bin:/app/models/indextts-model/hf_cache/campplus_cn_common.bin
      - /home/aigc/work/models/aivoice_models/indextts_models/bigvgan_v2_22khz_80band_256x:/app/models/indextts-model/hf_cache/bigvgan
      - /home/aigc/work/models/aivoice_models/indextts_models/MaskGCT:/app/models/MaskGCT
      - /home/aigc/work/models/aivoice_models/cloned_models/common_models:/app/models/service_model/common_models
      - /home/aigc/work/models/translate_models/fasttext_models:/app/models/fasttext_models
      - /home/aigc/data/aioutput/worker-logs/indextts-worker-preview-logs:/app/log
      - /home/aigc/data/ssh_control/indextts-worker-preview:/app/data/ssh_control
      - /home/aigc/data/rsync/socat_rsync_proxies:/app/data/socat_rsync_proxies
      - /home/aigc/data/rsync/local_rsync_proxies:/app/data/local_rsync_proxies
      - /home/aigc/.ssh:/mnt/ssh-keys:ro
      - /home/aigc/data/aioutput/wavcl/:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
  indextts-worker-1:
    image: indextts-worker:1.3
    hostname: indextts-worker-1
    container_name: indextts-worker-1
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - AIGC_UID=${AIGC_UID:-1001}
      - AIGC_GID=${AIGC_GID:-1001}
      - AIGC_HOME=${AIGC_HOME:-/home/aigc}
      - GPU_INDEX=0
      - CELERY_CONCURRENCY=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TZ=Asia/Shanghai
      # Cross-chunk GPT || s2mel overlap (1=on, 0=off)
      - INDEXTTS_PIPELINE_OVERLAP=1
      # quic or rsync, default is quic
      - FILE_SYNC_TRANSPORT=quic
    env_file:
      - /home/aigc/data/env/.env_usmqdb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/aigc/work/models/aivoice_models/indextts_models/IndexTTS-2.5:/app/models/indextts-model
      - /home/aigc/work/models/aivoice_models/indextts_models/w2v-bert-2.0:/app/models/indextts-model/hf_cache/w2v-bert-2.0
      - /home/aigc/work/models/aivoice_models/indextts_models/campplus/campplus_cn_common.bin:/app/models/indextts-model/hf_cache/campplus_cn_common.bin
      - /home/aigc/work/models/aivoice_models/indextts_models/bigvgan_v2_22khz_80band_256x:/app/models/indextts-model/hf_cache/bigvgan
      - /home/aigc/work/models/aivoice_models/indextts_models/MaskGCT:/app/models/MaskGCT
      - /home/aigc/work/models/aivoice_models/cloned_models/common_models:/app/models/service_model/common_models
      - /home/aigc/work/models/translate_models/fasttext_models:/app/models/fasttext_models
      - /home/aigc/data/ssh_control/indextts-worker-1:/app/data/ssh_control
      - /home/aigc/data/rsync/socat_rsync_proxies:/app/data/socat_rsync_proxies
      - /home/aigc/data/rsync/local_rsync_proxies:/app/data/local_rsync_proxies
      - /home/aigc/.ssh:/mnt/ssh-keys:ro
      - /home/aigc/data/aioutput/worker-logs/indextts-worker1-logs:/app/log
      - /home/aigc/data/aioutput/wavcl/:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    #tty: true
