services:
  tts-worker-2:
    image: tts-worker:5
    hostname: tts-worker-2
    container_name: tts-worker-2
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    environment:
      - AIGC_UID=${AIGC_UID:-1001}
      - AIGC_GID=${AIGC_GID:-1001}
      - GPU_INDEX=0
      - CELERY_CONCURRENCY=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - NLTK_DATA_PATH=/app/models/nltk_data
      - OPEN_JTALK_DICT_DIR=/app/models/text/open_jtalk_dic_utf_8-1.11
      - TZ=Asia/Shanghai
      # quic or rsync, default is quic
      - FILE_SYNC_TRANSPORT=quic
    env_file:
      - /home/aigc/data/env/.env_mqdb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/aigc/work/models/aivoice_models/gptsovits_model/GPT-SoVITS:/app/models/pretrained_models
      - /home/aigc/work/models/aivoice_models/gptsovits_model/GPT-SoVITS/G2PWModel:/app/models/text/G2PWModel
      - /home/aigc/work/models/aivoice_models/gptsovits_model/open_jtalk_dic_utf_8-1.11:/app/models/text/open_jtalk_dic_utf_8-1.11
      - /home/aigc/work/models/aivoice_models/fish_models:/app/models/fish_models
      #- /home/aigc/work/models/aivoice_models/indextts_models/IndexTTS-2:/app/models/indextts2-model
      #- /home/aigc/work/models/aivoice_models/indextts_models/w2v-bert-2.0:/app/models/w2v-bert-2.0
      #- /home/aigc/work/models/aivoice_models/indextts_models/MaskGCT:/app/models/MaskGCT
      #- /home/aigc/work/models/aivoice_models/indextts_models/campplus:/app/models/campplus
      #- /home/aigc/work/models/aivoice_models/indextts_models/bigvgan_v2_22khz_80band_256x:/app/models/bigvgan_v2_22khz_80band_256x
      - /home/aigc/work/models/aivoice_models/cloned_models/common_models:/app/models/service_model/common_models
      - /home/aigc/work/models/aivoice_models/nltk_data:/app/models/nltk_data
      #- /home/aigc/data/remote_rsync_server:/app/data/remote_rsync_server
      #- /home/aigc/data/remote_rsync_proxy:/app/data/remote_rsync_proxy
      - /home/aigc/data/ssh_control/tts-worker-2:/app/data/ssh_control
      - /home/aigc/data/rsync/socat_rsync_proxies:/app/data/socat_rsync_proxies
      - /home/aigc/data/rsync/local_rsync_proxies:/app/data/local_rsync_proxies
      - /home/aigc/.ssh:/home/aigc/.ssh
      - /home/aigc/data/aioutput/worker-logs/tts-worker2-logs:/app/log
      - /home/aigc/data/aioutput/wavcl/:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
