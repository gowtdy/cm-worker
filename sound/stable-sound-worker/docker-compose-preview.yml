services:
  sound-worker-preview:
    image: stable-sound-worker:0.1
    #image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-devel
    hostname: sound-worker-preview
    container_name: sound-worker-preview
    restart: unless-stopped
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 192.168.3.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    environment:
      - AIGC_UID=${AIGC_UID:-1001}
      - AIGC_GID=${AIGC_GID:-1001}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_REQUIRE_CUDA=cuda>=12.0
      - GPU_INDEX=0
      - CELERY_CONCURRENCY=1
      - TZ=Asia/Shanghai
      - NEED_TRANSLATE=True
      # quic or rsync, default is quic
      - FILE_SYNC_TRANSPORT=quic
    env_file:
      - /home/aigc/data/env/.env_usmqdb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/aigc/work/models/aivoice_models/sounds-effect_models:/app/models
      - /home/aigc/work/models/aichat_models/google-t5:/app/models/google-t5
      - /home/aigc/work/models/translate_models/fasttext_models:/app/models/fasttext_models
      - /home/aigc/data/aioutput/worker-logs/sound-worker-preview-logs:/app/log
      - /home/aigc/data/ssh_control/sound-worker-preview:/app/data/ssh_control
      - /home/aigc/data/socat_rsync_proxies:/app/data/socat_rsync_proxies
      - /home/aigc/.ssh:/mnt/ssh-keys:ro
      - /home/aigc/data/aioutput/sounds/tk:/app/output:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    #tty: true